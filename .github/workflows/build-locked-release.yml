name: build-locked-release

on:
  push:
    branches: [ main ]
    tags:
      - '*.*.*'
      - '*.*.*-h*'
  schedule:
    - cron: '0 4 */14 * *'  # Every 14 days at 04:00 UTC, refreshes floating alpine/debian/ubi tags

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/mkilijanek/parsedmarc-locked
  PYTHON_VERSION: "3.12"
  PIP_TOOLS_VERSION: "7.6.1"

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compute reproducible timestamps
        id: repro
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SDE=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_OUTPUT"
          BUILD_DATE=$(date -u -d "@${SDE}" +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            VERSION="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate requirements.lock (with hashes)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-tools==${PIP_TOOLS_VERSION}"
          pip-compile \
            --generate-hashes \
            --resolver=backtracking \
            --output-file requirements.lock \
            requirements.in

      - name: Upload requirements.lock artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: requirements.lock
          path: requirements.lock
          if-no-files-found: error

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push parsedmarc-locked:alpine
        id: build_alpine
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: Dockerfile-alpine.locked
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:alpine
            ${{ env.IMAGE }}:${{ steps.repro.outputs.VERSION }}-alpine
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.repro.outputs.BUILD_DATE }}
            SOURCE_DATE_EPOCH=${{ steps.repro.outputs.SOURCE_DATE_EPOCH }}
          sbom: true
          provenance: true

      - name: Build and push parsedmarc-locked:debian
        id: build_debian
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: Dockerfile-debian.locked
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:debian
            ${{ env.IMAGE }}:${{ steps.repro.outputs.VERSION }}-debian
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.repro.outputs.BUILD_DATE }}
            SOURCE_DATE_EPOCH=${{ steps.repro.outputs.SOURCE_DATE_EPOCH }}
          sbom: true
          provenance: true

      - name: Build and push parsedmarc-locked:ubi
        id: build_ubi
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: Dockerfile-ubi.locked
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:ubi
            ${{ env.IMAGE }}:${{ steps.repro.outputs.VERSION }}-ubi
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.repro.outputs.BUILD_DATE }}
            SOURCE_DATE_EPOCH=${{ steps.repro.outputs.SOURCE_DATE_EPOCH }}
          sbom: true
          provenance: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign images (keyless)
        shell: bash
        env:
          DIGEST_ALPINE: ${{ steps.build_alpine.outputs.digest }}
          DIGEST_DEBIAN: ${{ steps.build_debian.outputs.digest }}
          DIGEST_UBI: ${{ steps.build_ubi.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST_ALPINE}"
          cosign sign --yes "${IMAGE}@${DIGEST_DEBIAN}"
          cosign sign --yes "${IMAGE}@${DIGEST_UBI}"
