name: Scheduled Secure Image Build

on:
  schedule:
    - cron: '0 3 */14 * *'  # Every 14 days at 03:00 UTC
  workflow_dispatch:
    inputs:
      parsedmarc_version:
        description: 'Parsedmarc version (blank = version pinned in requirements.in)'
        required: false
        default: ''

env:
  IMAGE: ghcr.io/mkilijanek/parsedmarc

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.parsedmarc_version }}
        run: |
          set -euo pipefail
          # The pinned version in requirements.in is the source of truth; GitHub
          # releases lag behind it and would rebuild :latest from an old version.
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(sed -nE 's/^parsedmarc(\[[a-z,]+\])?==([0-9][0-9A-Za-z.+-]*)$/\2/p' requirements.in)"
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([0-9A-Za-z.+-]*)$'; then
            echo "Invalid parsedmarc version: '${VERSION}'" >&2
            exit 1
          fi
          # Allow optional hotfix suffix in image tag while installing base parsedmarc semver from PyPI.
          PARSEDMARC_VERSION="$(echo "${VERSION}" | sed -E 's/-h[0-9]+$//')"
          echo "PARSEDMARC_VERSION=${PARSEDMARC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compute reproducible timestamps
        id: repro
        shell: bash
        run: |
          SDE=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_OUTPUT"
          BUILD_DATE=$(date -u -d "@${SDE}" +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (standard)
        id: build_standard
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
          build-args: |
            PARSEDMARC_VERSION=${{ steps.version.outputs.PARSEDMARC_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.repro.outputs.BUILD_DATE }}
            SOURCE_DATE_EPOCH=${{ steps.repro.outputs.SOURCE_DATE_EPOCH }}
          sbom: true
          provenance: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign standard image (keyless)
        shell: bash
        env:
          DIGEST: ${{ steps.build_standard.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Build and push (distroless hardened)
        id: build_distroless
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.hardened
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:distroless
          build-args: |
            PARSEDMARC_VERSION=${{ steps.version.outputs.PARSEDMARC_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.repro.outputs.BUILD_DATE }}
            SOURCE_DATE_EPOCH=${{ steps.repro.outputs.SOURCE_DATE_EPOCH }}
          sbom: true
          provenance: true

      - name: Sign distroless image (keyless)
        shell: bash
        env:
          DIGEST: ${{ steps.build_distroless.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
