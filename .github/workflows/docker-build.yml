name: Build and Publish Docker Images (Reproducible Metadata)

on:
  push:
    tags:
      - '*.*.*'
      - '*.*.*-h*'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/mkilijanek/parsedmarc

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compute reproducible timestamps
        id: repro
        shell: bash
        run: |
          # Use commit time as SOURCE_DATE_EPOCH (reproducible)
          SDE=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_OUTPUT"
          # RFC3339 UTC derived from SOURCE_DATE_EPOCH (reproducible)
          BUILD_DATE=$(date -u -d "@${SDE}" +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          # Hotfix tags use suffix -hN (e.g. 9.1.0-h1); parsedmarc package stays at base semver.
          PARSEDMARC_VERSION="$(echo "${GITHUB_REF_NAME}" | sed -E 's/-h[0-9]+$//')"
          echo "PARSEDMARC_VERSION=${PARSEDMARC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker meta (standard)
        id: meta_std
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.repro.outputs.VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.created=${{ steps.repro.outputs.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.repro.outputs.VERSION }}

      - name: Docker meta (distroless)
        id: meta_dst
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.repro.outputs.VERSION }}-distroless
            type=raw,value=distroless
          labels: |
            org.opencontainers.image.created=${{ steps.repro.outputs.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.repro.outputs.VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ############################################################
      # Standard image
      ############################################################
      - name: Build and push (standard)
        id: build_standard
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_std.outputs.tags }}
          labels: ${{ steps.meta_std.outputs.labels }}
          build-args: |
            PARSEDMARC_VERSION=${{ steps.repro.outputs.PARSEDMARC_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.repro.outputs.BUILD_DATE }}
            SOURCE_DATE_EPOCH=${{ steps.repro.outputs.SOURCE_DATE_EPOCH }}
          sbom: true
          provenance: true

      ############################################################
      # Distroless hardened image
      ############################################################
      - name: Build and push (distroless hardened)
        id: build_distroless
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.hardened
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_dst.outputs.tags }}
          labels: ${{ steps.meta_dst.outputs.labels }}
          build-args: |
            PARSEDMARC_VERSION=${{ steps.repro.outputs.PARSEDMARC_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.repro.outputs.BUILD_DATE }}
            SOURCE_DATE_EPOCH=${{ steps.repro.outputs.SOURCE_DATE_EPOCH }}
          sbom: true
          provenance: true

      ############################################################
      # Cosign signing (keyless)
      ############################################################
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign images (keyless)
        shell: bash
        env:
          DIGEST_STD: ${{ steps.build_standard.outputs.digest }}
          DIGEST_DST: ${{ steps.build_distroless.outputs.digest }}
        run: |
          # Sign by digest: a tag could move between push and sign.
          cosign sign --yes "${IMAGE}@${DIGEST_STD}"
          cosign sign --yes "${IMAGE}@${DIGEST_DST}"
